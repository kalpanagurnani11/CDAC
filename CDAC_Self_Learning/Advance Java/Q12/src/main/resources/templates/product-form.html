<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
</head>
<body>
    <h2 th:text="${product.id != null} ? 'Edit Product' : 'Add Product'">Product Form</h2>
    <form th:action="@{/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />
        <table>
            <tr>
                <td>Name:</td>
                <td><input type="text" th:field="*{name}" required /></td>
            </tr>
            <tr>
                <td>Price:</td>
                <td><input type="number" step="0.01" th:field="*{price}" required /></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Save" />
                    <a th:href="@{/}">Cancel</a>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
