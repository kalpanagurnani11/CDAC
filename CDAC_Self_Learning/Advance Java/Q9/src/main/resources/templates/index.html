<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Management System (Spring Web)</title>
</head>
<body>
    <h1>Library Management (Spring MVC + Thymeleaf)</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.isbn}">ISBN</td>
            </tr>
        </tbody>
    </table>
    <h2>Add a New Book</h2>
    <form th:action="@{/addBook}" th:object="${newBook}" method="POST">
        <table>
            <tr>
                <td>Title:</td>
                <td><input type="text" th:field="*{title}" required></td>
            </tr>
            <tr>
                <td>Author:</td>
                <td><input type="text" th:field="*{author}" required></td>
            </tr>
            <tr>
                <td>ISBN:</td>
                <td><input type="text" th:field="*{isbn}" required></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Add Book"></td>
            </tr>
        </table>
    </form>
</body>
</html>
